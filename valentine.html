<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- VERY IMPORTANT for mobile -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For Hadassah</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#ff7eb3,#ffc8dd);
    font-family:'Segoe UI', sans-serif;
    overflow:hidden;
    padding:20px;
}

/* Floating background */
.background{
    position:fixed;
    width:100%;
    height:100%;
    top:0;
    left:0;
    z-index:0;
}

/* Floating items */
.float{
    position:absolute;
    bottom:-60px;
    animation:floatUp linear infinite;
    opacity:0.5;
}

@keyframes floatUp{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-120vh);
        opacity:0;
    }
}

/* Card */
.card{
    position:relative;
    z-index:1;
    background:rgba(255,255,255,0.96);
    backdrop-filter: blur(8px);
    padding:clamp(30px, 6vw, 70px);
    border-radius:28px;
    text-align:center;
    box-shadow:0 20px 50px rgba(0,0,0,0.25);
    max-width:600px;
    width:100%;
    animation:fadeIn 1.8s ease;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(40px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

h1{
    color:#ff4d88;
    font-size:clamp(32px, 6vw, 48px);
    margin-bottom:15px;
}

.question{
    font-size:clamp(22px, 5vw, 34px);
    color:#ff4d88;
    font-weight:bold;
    line-height:1.3;
}

</style>
</head>

<body>

<div class="background" id="background"></div>

<div class="card">
    <h1>Hadassah</h1>
    <div class="question">
        Will you be my Valentine?
    </div>
</div>

<script>

const items = ["❤️","🌸","🌹","💐","🌷"];

function createFloat(){
    const float = document.createElement("div");
    float.classList.add("float");
    float.innerHTML = items[Math.floor(Math.random()*items.length)];

    float.style.left = Math.random() * 100 + "vw";
    float.style.fontSize = (Math.random() * 18 + 18) + "px";
    float.style.animationDuration = (Math.random() * 4 + 5) + "s";

    document.getElementById("background").appendChild(float);

    setTimeout(() => float.remove(), 9000);
}

setInterval(createFloat, 300);

</script>

</body>
</html>
